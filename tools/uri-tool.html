<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URI Encoder/Decoder</title>
  <style>
    :root {
      --primary: #1a7f37;
      --primary-hover: #166b2e;
      --bg: #f5f7f4;
      --card-bg: #ffffff;
      --surface-alt: #eef1ee;
      --text: #1b2430;
      --text-muted: #5c6775;
      --border: #d9dfd9;
      --accent-soft: rgba(26,127,55,0.10);
      --success: #1a7f37;
    }
    body.dark {
      --primary: #3fb950;
      --primary-hover: #4cc861;
      --bg: #0a0d13;
      --card-bg: #121722;
      --surface-alt: #0d1119;
      --text: #c8d0de;
      --text-muted: #6b7789;
      --border: #212836;
      --accent-soft: rgba(63,185,80,0.12);
      --success: #3fb950;
    }
    body {
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", "SF Mono", Consolas, "Liberation Mono", monospace;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: none;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem;
    }
    header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    
    .input-section, .output-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    /* 입력/결과 좌우 2단 (전체 폭 활용) */
    .io-grid { display: flex; gap: 1.5rem; align-items: flex-start; }
    .io-grid .input-section, .io-grid .output-section { flex: 1; min-width: 0; }
    .io-grid textarea { min-height: 260px; }
    @media (max-width: 900px) { .io-grid { flex-direction: column; gap: 0; } .io-grid textarea { min-height: 160px; } }
    /* 입력/결과 헤더(라벨+버튼) — 높이 통일로 textarea 오와열 정렬 */
    .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; min-height: 2.2rem; }
    .btn.btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
    label { font-size: 0.875rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    textarea {
      width: 100%;
      box-sizing: border-box;   /* padding/border 포함 → 2단에서 겹침 방지 */
      min-height: 140px;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", "SF Mono", Consolas, "Liberation Mono", monospace;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: all 0.2s;
      background: var(--surface-alt);
    }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--accent-soft); }
    
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      padding: 0.75rem 1rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--surface-alt);
      color: var(--text);
    }
    .btn:hover { background: var(--accent-soft); border-color: var(--primary); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    body.dark .btn-primary { color: #0a0d13; }

    .controls .btn {
      flex: 0 0 auto;
      padding: 0.55rem 1.6rem;
    }

    /* 파라미터 테이블 스타일 */
    .param-section {
      margin-top: 1rem;
      padding-top: 1.5rem;
      border-top: 2px dashed var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background: var(--surface-alt); color: var(--text-muted); font-weight: 800; width: 30%; }
    .val-cell { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", "SF Mono", Consolas, "Liberation Mono", monospace; word-break: break-all; }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-weight: 800;
    }

    /* ===== Responsive: 모바일 ===== */
    @media (max-width: 600px) {
      body { padding: 0.75rem; overflow-x: hidden; }
      .card { padding: 1.1rem; border-radius: 4px; }
      header { flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
      h1 { font-size: 1.25rem; }
      th, td { padding: 0.55rem; }
      th { width: 32%; }
      .controls .btn { flex: 1 1 auto; }   /* 모바일에선 넓게(탭하기 쉽게) */
    }
  </style>
  <script src="lib/portal-theme.js"></script>
  <script src="lib/file-drop-handler.js"></script>
  <script src="lib/toast-utils.js"></script>
  <style>
    textarea.drag-hover { box-shadow: inset 0 0 0 3px var(--primary); }
    .uri-opts { display:flex; gap:1.25rem; align-items:center; flex-wrap:wrap; margin-bottom:1.25rem; font-size:0.85rem; color:var(--text-muted); font-weight:700; }
    .uri-opts select { padding:0.4rem 0.6rem; border:1px solid var(--border); border-radius:0.4rem; background:var(--card-bg); color:var(--text); font-weight:700; }
    .uri-opts label { display:flex; align-items:center; gap:0.4rem; cursor:pointer; }
    .help-tip { display:inline-flex; align-items:center; justify-content:center; width:1.1rem; height:1.1rem; border-radius:50%; border:1px solid var(--border); color:var(--text-muted); font-size:0.72rem; font-weight:800; cursor:help; user-select:none; }
    .help-tip:hover { border-color:var(--primary); color:var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <header>
        <h1>🔗 URI 도구 <span class="badge">PRO</span></h1>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" style="width: 100px; padding: 0.4rem 0.8rem; font-size:0.8rem;" onclick="loadSample()">샘플 로드</button>
          <button class="btn" style="padding: 0.4rem 0.8rem; font-size:0.8rem;" onclick="clearAll()">비우기</button>
        </div>
      </header>

      <div class="io-grid">
        <div class="input-section">
          <div class="sec-head"><label>Input</label></div>
          <textarea id="inputUri" placeholder="인코딩 또는 디코딩할 텍스트를 입력하세요... (파일을 끌어다 놓을 수 있어요)"></textarea>
        </div>

        <div class="output-section">
          <div class="sec-head">
            <label>Result</label>
            <button class="btn btn-sm" onclick="copyResult()">📋 복사</button>
          </div>
          <textarea id="outputUri" readonly placeholder="결과가 여기에 표시됩니다..."></textarea>
        </div>
      </div>

      <div class="uri-opts">
        <label>인코딩 방식
          <select id="encodeMode" title="Component: 모든 특수문자 인코딩 / 전체 URI: :/?&= 등은 보존">
            <option value="component">Component (encodeURIComponent)</option>
            <option value="full">전체 URI (encodeURI)</option>
          </select>
        </label>
        <label><input type="checkbox" id="plusSpace"> 디코딩 시 <code>+</code> → 공백 (폼 인코딩)<span class="help-tip" title="application/x-www-form-urlencoded(HTML 폼) 방식은 공백을 '+'로 표현합니다.&#10;&#10;• 켜기: 디코딩 시 '+' → 공백   (예: hello+world → hello world)&#10;• 끄기: '+'를 그대로 둠         (예: a+b → a+b)&#10;&#10;※ '%2B'는 이 옵션과 무관하게 항상 '+' 기호로 디코딩됩니다.">ⓘ</span></label>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="process('decode')">🔓 디코딩</button>
        <button class="btn btn-primary" onclick="process('encode')">🔒 인코딩</button>
      </div>

      <div id="paramSection" class="param-section" style="display: none;">
        <label>📌 Query Parameters</label>
        <table id="paramTable">
          <thead>
            <tr>
              <th>Key</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="paramBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('inputUri');
    const outputEl = document.getElementById('outputUri');
    const paramSection = document.getElementById('paramSection');
    const paramBody = document.getElementById('paramBody');

    // 입력 시 실시간 디코딩 시도 (선택 사항) — 디바운스로 키 입력마다 디코딩 방지
    const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
    const debouncedLiveDecode = debounce(() => { if (inputEl.value.includes('%')) {
      process('decode', true);
    } }, 200);
    inputEl.addEventListener('input', debouncedLiveDecode);

    function process(mode, silent = false) {
      const raw = inputEl.value;
      const input = raw.trim();
      if (!input && !silent) {
        showToast('내용을 입력해주세요.', 'warning');
        return;
      }

      try {
        let result = '';
        if (mode === 'decode') {
          let s = input;
          if (document.getElementById('plusSpace').checked) {
            s = s.replace(/\+/g, ' ');
          }
          result = decodeURIComponent(s);
        } else {
          // 인코딩은 원본(raw)으로 — trim하면 앞뒤 공백(%20)이 유실됨
          result = document.getElementById('encodeMode').value === 'full' ? encodeURI(raw) : encodeURIComponent(raw);
        }

        outputEl.value = result;
        
        // 쿼리 파라미터 파싱 시도
        parseQueryParams(result);

        if (!silent) {
          showToast(`${mode === 'decode' ? '디코딩' : '인코딩'} 완료`, 'success');
        }
      } catch (e) {
        if (!silent) {
          showToast('처리 중 오류가 발생했습니다. 형식을 확인해주세요.', 'error');
          console.error(e);
        }
      }
    }

    function parseQueryParams(urlText) {
      // Clear previous content securely
      while (paramBody.firstChild) {
        paramBody.removeChild(paramBody.firstChild);
      }
      
      try {
        // 1. Strip fragments (#) if present
        const urlWithoutFragment = urlText.split('#')[0];
        
        let searchPart = '';
        if (urlWithoutFragment.includes('?')) {
          searchPart = urlWithoutFragment.split('?')[1];
        } else if (urlWithoutFragment.includes('=') && !urlWithoutFragment.includes(' ')) {
          searchPart = urlWithoutFragment;
        }

        if (!searchPart) {
          paramSection.style.display = 'none';
          return;
        }

        const params = new URLSearchParams(searchPart);
        const entries = Array.from(params.entries());

        if (entries.length > 0) {
          const fragment = document.createDocumentFragment();
          entries.forEach(([key, val]) => {
            const tr = document.createElement('tr');
            
            const th = document.createElement('th');
            th.textContent = key;
            
            const td = document.createElement('td');
            td.className = 'val-cell';
            td.textContent = val;
            
            tr.appendChild(th);
            tr.appendChild(td);
            fragment.appendChild(tr);
          });
          paramBody.appendChild(fragment);
          paramSection.style.display = 'block';
        } else {
          paramSection.style.display = 'none';
        }
      } catch (e) {
        paramSection.style.display = 'none';
      }
    }

    async function copyResult() {
      if (!outputEl.value) {
        return;
      }
      const text = outputEl.value;
      // 보안 컨텍스트에선 Clipboard API 사용
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('결과가 클립보드에 복사되었습니다.', 'success');
          return;
        } catch (err) {}
      }
      // file://·비보안 컨텍스트 폴백 (다른 도구엔 있는 execCommand 폴백이 이 도구엔 없었음)
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (ok) {
        showToast('결과가 클립보드에 복사되었습니다.', 'success');
      } else {
        showToast('복사에 실패했습니다.', 'error');
      }
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      paramSection.style.display = 'none';
      while (paramBody.firstChild) {
        paramBody.removeChild(paramBody.firstChild);
      }
      inputEl.focus();
    }

    function loadSample() {
      inputEl.value = 'https://www.google.com/search?q=%EB%84%A4%EC%9D%B4%EB%B2%84&sourceid=chrome&ie=UTF-8';
      process('decode');
    }

    // 파일 드래그앤드롭으로 입력 채우기
    fileDropHandler.init(inputEl, {
      onText: (content) => { inputEl.value = content; inputEl.dispatchEvent(new Event('input')); showToast('파일 내용을 불러왔습니다.', 'success'); },
      onImage: () => showToast('이미지는 지원하지 않습니다.', 'warning')
    });
  </script>
</body>
</html>
